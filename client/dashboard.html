<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Archive</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hurricane&family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/">Property Archive</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/dashboard.html">DASHBOARD</a>
        </li>
        <li class="nav-item nav-separator">|</li>
        <li class="nav-item">
          <a class="nav-link" href="#" id="nav-logout">LOGOUT</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

  <!-- Main Content -->
  <main class="container mt-4">
    <div class="row mb-4">
      <div class="col">
        <h2>My Inventory</h2>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addItemModal">
          + Add Item
        </button>
        <div class="btn-group">
  <button class="btn btn-success" id="export-csv">Export CSV</button>
  <button class="btn btn-primary" id="export-pdf">Export PDF</button>
</div>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="row mb-4">
      <div class="col-md-3">
        <div class="card text-center stats-card">
          <div class="card-body">
            <h5 class="card-title">Total Items</h5>
            <p class="display-6" id="total-items">0</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center stats-card">
          <div class="card-body">
            <h5 class="card-title">Categories</h5>
            <p class="display-6" id="total-categories">0</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center stats-card">
          <div class="card-body">
            <h5 class="card-title">Photos</h5>
            <p class="display-6" id="total-photos">0</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center stats-card">
          <div class="card-body">
            <h5 class="card-title">Total Value</h5>
            <p class="display-6" id="total-value">$0</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter and Search -->
    <div class="row mb-3">
      <div class="col-md-6">
        <input type="text" class="form-control" id="search-input" placeholder="Search items...">
      </div>
      <div class="col-md-4">
        <select class="form-select" id="category-filter">
          <option value="">All Categories</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-outline-secondary w-100" id="manage-categories">
          Manage Categories
        </button>
      </div>
    </div>

      <!-- Items Grid -->
<div class="row g-4" id="items-container">
  <!-- Items loaded here -->
</div>

  <!-- Add Item Modal -->
  <div class="modal fade" id="addItemModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="add-item-form">
            <div class="mb-3">
              <label for="item-name" class="form-label">Item Name *</label>
              <input type="text" class="form-control" id="item-name" required>
            </div>
            <div class="mb-3">
              <label for="item-description" class="form-label">Description</label>
              <textarea class="form-control" id="item-description" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label for="item-category" class="form-label">Category</label>
              <select class="form-select" id="item-category">
                <option value="">No Category</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="item-location" class="form-label">Vendor</label>
              <input type="text" class="form-control" id="item-location">
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="item-purchase-date" class="form-label">Purchase Date</label>
                <input type="date" class="form-control" id="item-purchase-date">
              </div>
              <div class="col-md-6 mb-3">
                <label for="item-purchase-price" class="form-label">Purchase Price</label>
                <input type="number" class="form-control" id="item-purchase-price" step="0.01" min="0">
              </div>
            </div>
            <div class="mb-3">
              <label for="item-quantity" class="form-label">Quantity</label>
              <input type="number" class="form-control" id="item-quantity" min="1" value="1">
            </div>
            <div class="mb-3">
              <label for="item-photos" class="form-label">Photos (max 5)</label>
              <input type="file" class="form-control" id="item-photos" accept="image/*" multiple>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-item">Save Item</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Categories Modal -->
  <div class="modal fade" id="categoriesModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Manage Categories</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="new-category-name" class="form-label">New Category Name</label>
            <div class="input-group">
              <input type="text" class="form-control" id="new-category-name">
              <button class="btn btn-primary" id="add-category">Add</button>
            </div>
          </div>
          <hr>
          <div id="categories-list">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/dashboard.ts"></script>
</body>
</html>
